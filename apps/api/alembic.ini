# [导读] 用途：配置 Alembic 迁移脚本目录、数据库连接占位和日志。
# [导读] 为什么：迁移工具需知道修订链位置；具体连接还要结合 alembic/env.py 与应用设置确认。
# [导读] 提醒：执行迁移前核对最终数据库地址，不能仅凭本文件的默认地址判断连接目标。
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
sqlalchemy.url = sqlite:///./dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
