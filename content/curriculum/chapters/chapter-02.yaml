- id: chapter-2-section-1
  title: 应对虚盘
  description: 识破无约束力的虚盘（USD 290 subject to confirmation），推动对方转为实盘。
  learning_objectives:
  - 识破 subject to confirmation 意味着无约束力
  - 要求对方发出有约束力的实盘
  - 初步表达对 290 价格的保留
