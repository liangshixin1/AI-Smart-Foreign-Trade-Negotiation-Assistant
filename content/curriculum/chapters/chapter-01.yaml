id: chapter-1
title: 流程 1 · 询盘（Enquiry）
sort_order: 1
units:
- id: chapter-1-section-1
  title: 发出具体询盘
  description: 就 NT-IM250 发出具体询盘，索取报价、规格与交易条件，同时保留议价空间。
  learning_objectives:
  - 询盘要素齐全（品名、数量、贸易术语、索取条款）
  - 不过早暴露全部底牌（保留议价空间）
  - 推动对方进入正式报盘
