- id: chapter-1-section-2
  title: 催询与条件探询
  description: 回应卖方的探询并催促其发出正式报盘，避免暴露过多底牌。
  learning_objectives:
  - 有策略地提供信息以换取报盘
  - 保留议价空间，不暴露预算上限与急迫度
  - 成功逼出对方即将报盘的承诺
