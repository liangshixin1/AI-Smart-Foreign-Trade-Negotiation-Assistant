- id: chapter-8-section-1
  title: 提出质量索赔
  description: 撰写证据链完整的质量索赔函，正确切分保险与质量两类责任。
  learning_objectives:
  - 索赔函证据链完整（证书、编号/数量、损失计算）
  - 援引合同/检验条款、诉求合理、设定回应期限
  - （加分）水渍损失走保险、质量问题向卖方索赔（区分两类责任）
