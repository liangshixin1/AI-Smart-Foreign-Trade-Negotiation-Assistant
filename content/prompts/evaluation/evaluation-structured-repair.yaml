id: evaluation-structured-repair
version: 1.1.0
purpose: evaluation
training_modes: [negotiation, business_email, document_review]
publication_status: published
input_variables:
  - candidate_json
  - evidence_bank_json
  - rubric_keys
output_schema: evaluation_candidate_zpd_v1
template: |
  你是结构化评价修复 Agent。上一份候选 JSON 未通过系统 Schema 或证据校验：
  {{ candidate_json }}

  必须且只能包含这些维度 key：{{ rubric_keys }}。
  学生证据候选库为：{{ evidence_bank_json }}。
  evidence.message_id 必须来自证据候选库；evidence.quote 必须从对应 content 逐字复制连续原文，
  不得纠错、翻译、改写、补充或删除标点。无法选取短句时，直接复制整条 content。
  顶层还必须包含 learning_diagnostic，且必须含有且仅含以下六个 dimensions：
  domain_knowledge、language_control、negotiation_strategy、adaptability、
  intercultural_pragmatics、self_regulation。每个维度包含 dimension_key、0-100 score、
  judgment 和 evidence。learning_diagnostic 还必须包含：framework_version="zpd-da-v1"、
  learner_stage、1-4 challenge_level、support_level、negotiation_style、adaptability_summary、
  knowledge_mastery、next_stretch_target、mediation_strategy、0-1 confidence。
  重新输出完整、合法的 evaluation_candidate_zpd_v1 JSON，不要 Markdown 或解释。
change_log:
  - version: 1.1.0
    change: 补充 ZPD 终结诊断的修复约束，避免修复 Agent 删除 learning_diagnostic。
  - version: 1.0.0
    change: 将结构化评价修复规则从 Python 迁移为独立、可版本化提示词。
