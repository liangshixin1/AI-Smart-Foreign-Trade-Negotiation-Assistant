  \ 即期 L/C、收证后 40 天\",\n    \"确认增值：一年期备件包 + 远程技术支持\",\n    \"请对方拟备销售确认书并表达将尽快开证\"\n  ],\n  \"opening_message_hint\": \"Dear\
