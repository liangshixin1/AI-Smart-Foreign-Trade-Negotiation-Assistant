  {\n  \"scenario_title\": \"关卡 4-1 · 确认成交与拟备销售确认书\",\n  \"scenario_summary\": \"双方就 285、L/C、40 天、增值服务达成一致。需要把口头/函电共识固化为正式文件。NovaTech\
