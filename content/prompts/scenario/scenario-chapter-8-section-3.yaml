template: "你是外贸训练的场景生成 Agent。为“{{ unit_title }}”生成本次可复盘的场景快照。\n难度：{{ difficulty }}；学习目标：{{ learning_objectives }}。\n必须以以下课程蓝图为事实边界，可以微调措辞和沟通压力，不得改变公司、产品、金额、日期、单证号或已锁定条款：\n\
  {\n  \"scenario_title\": \"关卡 8-3 · 理赔和解\",\n  \"scenario_summary\": \"双方就 35 件质量责任基本达成共识，进入金额与方式的最后磋商。教材结局：NovaTech 让步、双方和解（折价补偿/补货/未来订单折扣），维护长期关系。\"\
  ,\n  \"student_task\": \"以翰霖名义与 NovaTech 达成理赔和解——就补偿金额或方式（现金/折扣/补货/未来订单优惠）谈成双方接受的方案，并确认结案、维护合作。\",\n  \"student_role\":\
  \ \"中国买方 · 上海翰霖采购总监 陈一帆（Chen Yifan）\",\n  \"ai_role\": \"David Lim · NovaTech 出口总监（Export Director，卖方）\",\n  \"product\"\
  : \"NT-IM250 · P2.5 室内 LED 显示模组；像素间距 2.5mm，亮度 ≥1200 cd/m²，色温 6500K±300K；800 件（本次交易标的）\",\n  \"negotiation_targets\": [\n\
  \    \"谈成对己方有实质价值且维护长期关系的方案\",\n    \"在补偿金额/方式上达成双赢\",\n    \"确认结案、维护合作\"\n  ],\n  \"checklist\": [\n    \"评估现金 vs 非现金（折扣/补货/未来订单优惠）方案\"\
  ,\n    \"争取不低于合理诉求的实质价值\",\n    \"达成和解并确认结案、表达合作期待\"\n  ],\n  \"opening_message_hint\": \"Dear Mr. Chen, in the spirit of\
  \ our partnership, I would like to find a fair resolution on the 35 sets. I am confident we can agree something that works\
  \ for you and preserves our cooperation. What outcome would you prefer?\",\n  \"market_landscape\": \"卖方倾向非现金方式（成本更低、更利于绑定关系）。\"\
  ,\n  \"timeline\": \"2027 年 4 月底 / 5 月初。\",\n  \"logistics\": \"就 35 件质量瑕疵的理赔金额与方式最后磋商。\",\n  \"risks\": [],\n  \"knowledge_points\"\
  : [\n    \"理赔和解\",\n    \"非现金补偿\",\n    \"互利共赢\",\n    \"争议收束\"\n  ]\n}\n\n只输出合法 JSON，不要 Markdown，严格使用以下结构：\n{\n  \"public\"\
