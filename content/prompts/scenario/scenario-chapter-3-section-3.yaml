  ,\n  \"student_role\": \"中国买方 · 上海翰霖采购总监 陈一帆（Chen Yifan）\",\n  \"ai_role\": \"David Lim · NovaTech 出口总监（Export Director，卖方）\"\
  ,\n  \"product\": \"NT-IM250 · P2.5 室内 LED 显示模组；像素间距 2.5mm，亮度 ≥1200 cd/m²，色温 6500K±300K；800 件（本次交易标的）\",\n  \"negotiation_targets\"\
  : [\n    \"用有条件接受/反建议收束谈判\",\n    \"在接受 285 的同时争取增值服务\",\n    \"实现体面双赢成交\"\n  ],\n  \"checklist\": [\n    \"明确接受 USD 285\
  \ / L/C / 40 天的核心条款\",\n    \"提出反建议争取增值（备件包/技术支持/质保/未来订单）\",\n    \"理解有条件接受在法律上可能构成还盘\"\n  ],\n  \"opening_message_hint\"\
  : \"Dear Mr. Chen, we have made good progress. On price, USD 285.00 CIF Shanghai is our firm and final figure, offered with\
  \ a long-term partnership in mind. I would, however, welcome a constructive way to close — please tell me how you would\
  \ like to finalise.\",\n  \"market_landscape\": \"卖方愿以「做大蛋糕」（增值服务）促成交易、巩固长期关系，但不再降价。\",\n  \"timeline\": \"2027 年 1 月 13–15\
  \ 日，实盘有效期最后阶段。\",\n  \"logistics\": \"价格 285、付款 100% 即期 L/C、交期收证后 40 天已基本谈定。\",\n  \"risks\": [],\n  \"knowledge_points\"\
  : [\n    \"有条件接受\",\n    \"反建议\",\n    \"做大蛋糕（增值替代降价）\",\n    \"双赢成交\"\n  ]\n}\n\n只输出合法 JSON，不要 Markdown，严格使用以下结构：\n{\n\
  \  \"public\": {\n    \"scenario_title\": \"字符串\", \"scenario_summary\": \"字符串\", \"student_task\": \"字符串\",\n    \"student_role\"\
  : \"字符串\", \"ai_role\": \"字符串\", \"product\": \"字符串\",\n    \"negotiation_targets\": [\"字符串\"], \"checklist\": [\"字符串\"\
  ],\n    \"opening_message\": \"David Lim 对学生说的第一轮专业英文商务发言\"\n  },\n  \"private\": {\n    \"seller_strategy\": \"本关卖方策略\"\
  , \"opening_anchor\": \"本关初始立场\",\n    \"bottom_line_reminder\": \"不泄露底牌和服务端提示的提醒\"\n  }\n}\npublic 绝不包含成本、底线、BATNA 或隐藏提示。opening_message\
  \ 只能代表 David Lim，不得替学生作答。"
