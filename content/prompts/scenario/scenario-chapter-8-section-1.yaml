template: "你是外贸训练的场景生成 Agent。为“{{ unit_title }}”生成本次可复盘的场景快照。\n难度：{{ difficulty }}；学习目标：{{ learning_objectives }}。\n必须以以下课程蓝图为事实边界，可以微调措辞和沟通压力，不得改变公司、产品、金额、日期、单证号或已锁定条款：\n\
  {\n  \"scenario_title\": \"关卡 8-1 · 提出质量索赔\",\n  \"scenario_summary\": \"货到上海复验，CCIC 上海证书 CCIC-SH-2027-04-1188 认定 35 件存在色温偏差/亮度不达标；另有\
  \ 15 件因集装箱进水受潮损坏（属保险范畴）。翰霖需就质量问题提出正式索赔。\",\n  \"student_task\": \"以翰霖名义撰写正式质量索赔函——附商检证书与损失清单、明确诉求金额、援引合同与检验条款、设定回应期限。诉求：35\
  \ 件×USD 51 差价 + USD 210 复检费 = USD 1,995。\",\n  \"student_role\": \"中国买方 · 上海翰霖采购总监 陈一帆（Chen Yifan）\",\n  \"ai_role\": \"\
  David Lim · NovaTech 出口总监（Export Director，卖方）\",\n  \"product\": \"NT-IM250 · P2.5 室内 LED 显示模组；像素间距 2.5mm，亮度 ≥1200 cd/m²，色温\
  \ 6500K±300K；800 件（本次交易标的）\",\n  \"negotiation_targets\": [\n    \"索赔函证据链完整（证书、编号/数量、损失计算）\",\n    \"援引合同/检验条款、诉求合理、设定回应期限\"\
  ,\n    \"（加分）水渍损失走保险、质量问题向卖方索赔（区分两类责任）\"\n  ],\n  \"checklist\": [\n    \"附 CCIC 证书与损失清单，明确 35 件色温/亮度问题\",\n    \"明确诉求金额\
  \ USD 1,995（差价 + 复检费）\",\n    \"把 15 件水渍损失正确归入保险索赔\",\n    \"援引合同与检验条款、设定回应期限\"\n  ],\n  \"opening_message_hint\": \"Dear\
  \ Mr. Chen, I hope the shipment arrived safely. Should you have any observations following inspection on arrival, please\
  \ let me know, and do include the supporting documentation so we can review any matter properly.\",\n  \"market_landscape\"\
  : \"水渍 15 件属运输风险（走 ICC(A) 保险）；色温/亮度 35 件才涉及卖方质量责任。\",\n  \"timeline\": \"2027 年 4 月 20 日货到后。\",\n  \"logistics\": \"CCIC\
  \ 上海证书 CCIC-SH-2027-04-1188；规格色温 6500K±300K、亮度 ≥1200cd/m²。\",\n  \"risks\": [],\n  \"knowledge_points\": [\n    \"质量索赔\"\
  ,\n    \"证据链\",\n    \"责任切分（保险 vs 质量）\",\n    \"CIF 风险转移\"\n  ]\n}\n\n只输出合法 JSON，不要 Markdown，严格使用以下结构：\n{\n  \"public\"\
  : {\n    \"scenario_title\": \"字符串\", \"scenario_summary\": \"字符串\", \"student_task\": \"字符串\",\n    \"student_role\": \"\
  字符串\", \"ai_role\": \"字符串\", \"product\": \"字符串\",\n    \"negotiation_targets\": [\"字符串\"], \"checklist\": [\"字符串\"],\n\
  \    \"opening_message\": \"David Lim 对学生说的第一轮专业英文商务发言\"\n  },\n  \"private\": {\n    \"seller_strategy\": \"本关卖方策略\", \"\
  opening_anchor\": \"本关初始立场\",\n    \"bottom_line_reminder\": \"不泄露底牌和服务端提示的提醒\"\n  }\n}\npublic 绝不包含成本、底线、BATNA 或隐藏提示。opening_message\
  \ 只能代表 David Lim，不得替学生作答。"
