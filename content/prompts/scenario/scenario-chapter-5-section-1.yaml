  ,\n    \"规范唛头与指示性标志（KEEP DRY / THIS SIDE UP）\"\n  ],\n  \"opening_message_hint\": \"Dear Mr. Chen, as we prepare for production,\
  \ I would welcome your packing and shipping-mark requirements for the NT-IM250 modules. We will of course ensure proper\
  \ protection for these precision goods. Please let me know your specifications.\",\n  \"market_landscape\": \"货物是精密 LED\
