  ,\n  \"timeline\": \"2027 年 1 月 10 日左右；实盘有效期至 1 月 15 日。\",\n  \"logistics\": \"实盘：USD 285/件 CIF 上海，800 件。\",\n  \"risks\"\
  : [\n    \"无依据猛砍价会被坚决拒绝\",\n    \"措辞失礼或威胁会触发对等强硬反应\"\n  ],\n  \"knowledge_points\": [\n    \"还盘的法律性质（CISG 19）\",\n    \"\
  价格还盘\",\n    \"锚定策略\",\n    \"让步与交换\"\n  ]\n}\n\n只输出合法 JSON，不要 Markdown，严格使用以下结构：\n{\n  \"public\": {\n    \"scenario_title\"\
  : \"字符串\", \"scenario_summary\": \"字符串\", \"student_task\": \"字符串\",\n    \"student_role\": \"字符串\", \"ai_role\": \"字符串\"\
  , \"product\": \"字符串\",\n    \"negotiation_targets\": [\"字符串\"], \"checklist\": [\"字符串\"],\n    \"opening_message\": \"\
  David Lim 对学生说的第一轮专业英文商务发言\"\n  },\n  \"private\": {\n    \"seller_strategy\": \"本关卖方策略\", \"opening_anchor\": \"本关初始立场\"\
  ,\n    \"bottom_line_reminder\": \"不泄露底牌和服务端提示的提醒\"\n  }\n}\npublic 绝不包含成本、底线、BATNA 或隐藏提示。opening_message 只能代表 David Lim，不得替学生作答。"
